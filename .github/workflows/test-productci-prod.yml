name: Product CI CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # =========================================================
  # JOB 1: CI - Integration Test
  # =========================================================
  integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check server syntax
        run: node --check server.js

      - name: Create environment file
        run: |
          cat > .env <<'EOF'
          PORT=3000
          MONGO_URI=mongodb://nammongodb:27017/productdb
          EOF

      - name: Validate Docker Compose
        run: docker compose config

      - name: Start MongoDB and Product API
        run: docker compose up -d --build

      - name: Wait for healthchecks
        run: |
          echo "Waiting for MongoDB and Product API..."

          for i in {1..30}; do
            MONGO_STATUS=$(docker inspect \
              --format='{{.State.Health.Status}}' \
              nammongodb 2>/dev/null || echo "starting")

            API_STATUS=$(docker inspect \
              --format='{{.State.Health.Status}}' \
              product-api-container 2>/dev/null || echo "starting")

            echo "MongoDB: $MONGO_STATUS | Product API: $API_STATUS"

            if [ "$MONGO_STATUS" = "healthy" ] && \
               [ "$API_STATUS" = "healthy" ]; then
              echo "MongoDB and Product API are healthy."
              exit 0
            fi

            sleep 2
          done

          echo "Healthcheck failed."
          docker compose ps
          docker compose logs
          exit 1

      - name: Test health endpoint
        run: |
          RESPONSE=$(curl -sS -f http://localhost:3000/health)

          echo "$RESPONSE"

          echo "$RESPONSE" | grep -q '"status":"healthy"'
          echo "$RESPONSE" | grep -q '"mongodb":"connected"'

      - name: Test CREATE Product
        run: |
          RESPONSE=$(curl -sS -f \
            -X POST http://localhost:3000/api/products \
            -H "Content-Type: application/json" \
            -d '{"pid":"CI001","pname":"CI Product","price":1000,"quantity":5}')

          echo "$RESPONSE"

          echo "$RESPONSE" | grep -q '"pid":"CI001"'

      - name: Test READ Product
        run: |
          RESPONSE=$(curl -sS -f \
            http://localhost:3000/api/products/CI001)

          echo "$RESPONSE"

          echo "$RESPONSE" | grep -q '"pid":"CI001"'
          echo "$RESPONSE" | grep -q '"quantity":5'

      - name: Test UPDATE Product
        run: |
          RESPONSE=$(curl -sS -f \
            -X PUT http://localhost:3000/api/products/CI001 \
            -H "Content-Type: application/json" \
            -d '{"pname":"CI Product Updated","price":2000,"quantity":7}')

          echo "$RESPONSE"

          echo "$RESPONSE" | grep -q '"pname":"CI Product Updated"'
          echo "$RESPONSE" | grep -q '"price":2000'
          echo "$RESPONSE" | grep -q '"quantity":7'

      - name: Test DELETE Product
        run: |
          RESPONSE=$(curl -sS -f \
            -X DELETE http://localhost:3000/api/products/CI001)

          echo "$RESPONSE"

          echo "$RESPONSE" | grep -q '"message":"Product deleted successfully"'

      - name: Verify Product deleted
        run: |
          STATUS=$(curl -s \
            -o delete-check.json \
            -w "%{http_code}" \
            http://localhost:3000/api/products/CI001)

          cat delete-check.json

          if [ "$STATUS" != "404" ]; then
            echo "Expected HTTP 404 but received $STATUS"
            exit 1
          fi

          grep -q '"message":"Product not found"' delete-check.json

      - name: Show Docker status
        if: always()
        run: docker compose ps

      - name: Show logs when CI fails
        if: failure()
        run: docker compose logs

      - name: Cleanup CI containers
        if: always()
        run: docker compose down -v

  # =========================================================
  # JOB 2: CD - Build and Push Image to Docker Hub
  # =========================================================
  dockerhub-push:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    needs: integration-test

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/product-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/product-api:${{ github.sha }}

  # =========================================================
  # JOB 3: CD - Deploy to Local Docker Engine
  # =========================================================
  deploy-local:
    runs-on:
      - self-hosted
      - Windows
      - X64

    timeout-minutes: 10

    needs:
      - integration-test
      - dockerhub-push

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Create production environment file
        shell: powershell
        run: |
          @(
            "PORT=3000"
            "MONGO_URI=mongodb://nammongodb:27017/productdb"
          ) | Set-Content -Path .env -Encoding ascii

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull latest production image
        shell: powershell
        run: |
          docker compose -f docker-compose-prod.yaml pull

      - name: Deploy to local Docker Engine
        shell: powershell
        run: |
          docker compose -f docker-compose-prod.yaml up -d

      - name: Wait for local healthchecks
        shell: powershell
        run: |
          Write-Host "Waiting for local deployment..."

          for ($i = 1; $i -le 30; $i++) {

            $mongo = docker inspect `
              --format='{{.State.Health.Status}}' `
              nammongodb 2>$null

            $api = docker inspect `
              --format='{{.State.Health.Status}}' `
              product-api-container 2>$null

            if (-not $mongo) {
              $mongo = "starting"
            }

            if (-not $api) {
              $api = "starting"
            }

            Write-Host "MongoDB: $mongo | Product API: $api"

            if (
              $mongo -eq "healthy" -and
              $api -eq "healthy"
            ) {
              Write-Host "Local deployment is healthy."
              exit 0
            }

            Start-Sleep -Seconds 2
          }

          Write-Host "Local deployment healthcheck failed."

          docker compose -f docker-compose-prod.yaml ps
          docker compose -f docker-compose-prod.yaml logs

          exit 1

      - name: Verify deployed image
        shell: powershell
        run: |
          $image = docker inspect product-api-container `
            --format='{{.Config.Image}}'

          Write-Host "Running image: $image"

          $expectedImage = "${{ secrets.DOCKERHUB_USERNAME }}/product-api:latest"

          if ($image -ne $expectedImage) {
            Write-Host "Expected image: $expectedImage"
            Write-Host "Actual image:   $image"
            exit 1
          }

          Write-Host "Correct Docker Hub image is running."

      - name: Test local health endpoint
        shell: powershell
        run: |
          $response = Invoke-RestMethod `
            -Uri "http://localhost:3000/health"

          $response | ConvertTo-Json

          if ($response.status -ne "healthy") {
            throw "Product API is not healthy."
          }

          if ($response.mongodb -ne "connected") {
            throw "MongoDB is not connected."
          }

          Write-Host "Local Product API healthcheck passed."

      - name: Show production status
        if: always()
        shell: powershell
        run: |
          docker compose -f docker-compose-prod.yaml ps